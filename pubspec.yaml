name: wayaak
description: "A new Flutter project."

publish_to: "none"

version: 2.3.3+15

environment:
  sdk: ">=3.3.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  badges: ^3.1.2
  country_flags: ^3.0.0
  flutter_local_notifications: ^19.5.0
  get: ^4.6.6
  pinput: ^3.0.1
  flutter_svg: ^2.0.9
  flutter_svg_provider: ^1.0.7
  carousel_slider: ^5.0.0
  permission_handler: ^11.1.0
  cached_network_image: ^3.2.3
  lottie: ^3.0.0
  intl_phone_field: ^3.2.0
  # phone_form_field: ^10.0.1
  shared_preferences: ^2.2.2
  dotted_line: ^3.2.2
  google_maps_flutter: ^2.2.8
  intl: ^0.20.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.2
  web_socket_channel: ^3.0.1
  flutter_rating_bar: ^4.0.1
  crypto: ^3.0.3
  dio: 5.9.1
  # dio: ^5.5.0+1
  webview_flutter: ^4.8.0
  location: ^7.0.0
  flutter_polyline_points: ^2.1.0
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.0.1
  url_launcher: ^6.3.0
  dotted_decoration: ^2.0.0
  flutter_animarker: ^3.2.0
  # open_street_map_search_and_pick: ^0.1.1
  map_location_picker: ^1.3.2
  sign_in_with_apple: ^6.1.4
  upgrader: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.6.1
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.1.0



flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app-icon.png"
#  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/images/app-icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lotties/
    - assets/locales/

  fonts:
    - family: Poppin
      fonts:
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 500
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800
